[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aru-decision-evidence-lab"
version = "0.2.0"
description = "Experimental evidence-first evaluation of agent routing decisions"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
  {name = "ĀRU Intelligence contributors"}
]
keywords = ["ai-evaluation", "off-policy-evaluation", "decision-audit", "agent-routing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.scripts]
aru-evidence = "experiment_cli:main"
aru-gateway = "evidence_gateway:main"
aru-squad = "squad_benchmark:main"
aru-llm-squad = "llm_squad_benchmark:main"

[tool.setuptools]
py-modules = [
  "regret_aware_scaffold",
  "benchmark",
  "off_policy_evaluation",
  "anytime_evidence",
  "experiment_protocol",
  "route_experiments",
  "evidence_lab",
  "crossfit_diagnostics",
  "evidence_dashboard",
  "evidence_audit",
  "experiment_cli",
  "external_adapter",
  "scientific_validation",
  "distribution_robustness",
  "squad_sentence_retrieval",
  "squad_benchmark",
  "llm_executor",
  "llm_squad_benchmark",
  "evidence_gateway_store",
  "evidence_gateway",
]
