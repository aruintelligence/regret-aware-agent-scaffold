name: Python regression tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run stdlib tests and benchmark
        run: |
          python3 -m unittest discover -s tests -v
          python3 benchmark.py --runs 5 > /tmp/scaffold-benchmark.json
          python3 -m json.tool /tmp/scaffold-benchmark.json > /dev/null
  real_watch_audit:
    name: Real model · public human-gold prospective watch audit
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 7
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real pretrained CPU model runtime
        run: |
          python -m pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check transformers==4.48.3 safetensors==0.5.3
      - name: Fetch pinned, human-annotated public dataset
        run: |
          mkdir -p benchmark-data real-watch-report
          curl --fail --location --show-error --silent --retry 3 --max-time 120 https://rajpurkar.github.io/SQuAD-explorer/dataset/dev-v1.1.json --output benchmark-data/dev-v1.1.json
          echo "95aa6a52d5d6a735563366753ca50492a658031da74f301ac5238b03966972c9  benchmark-data/dev-v1.1.json" | sha256sum --check
          sha256sum REAL_MODEL_WATCH_PROTOCOL.md > real-watch-report/protocol.sha256
      - name: Collect all real-model calls, score human gold, stress watch
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          python real_model_watch_audit.py \
            --dataset benchmark-data/dev-v1.1.json \
            --out-dir real-watch-report/audit \
            --qa-model distilbert/distilbert-base-cased-distilled-squad \
            --acknowledge-model-calls
      - name: Recompute ordered evidence and check strict claim boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from anytime_risk_watch import watch_risk_stream
          root = Path('real-watch-report/audit')
          report = json.loads((root / 'report.json').read_text())
          rows = [json.loads(line) for line in (root / 'outcomes.jsonl').read_text().splitlines()]
          assert report['kind'] == 'aru_real_model_anytime_watch_public_human_gold_audit'
          assert report['offset'] == 200 and report['requested'] == report['observed'] == len(rows) == 120
          assert report['dataset_sha256'] == '95aa6a52d5d6a735563366753ca50492a658031da74f301ac5238b03966972c9'
          assert report['model_revision'] and report['verified_source_certificates'] <= 120
          assert report['model_call_failures_counted_as_errors'] == 0
          assert report['observed_outcomes_kind'].startswith('actual_model_calls')
          assert report['stress_outcomes_kind'].startswith('synthetic_')
          assert report['automatic_rollout_permitted'] is False
          independently_recomputed = watch_risk_stream(
              rows, groups=report['groups'], model_revision=report['model_revision'],
              rubric_id=report['rubric_id'], target_error=report['target_error'],
              alpha=report['familywise_alpha'],
          )
          assert independently_recomputed == report['observed_model_watch']
          assert len(report['injected_deterioration']) == 6
          print('Observed model alarm:', report['observed_model_watch']['degradation_alarm'])
          print('Observed source certificates:', report['verified_source_certificates'])
          print('Synthetic drift results:', report['injected_deterioration'])
          print('No customer or production deterioration claim.')
          PY
      - name: Retain public-benchmark evidence without raw passages or answers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aru-real-model-anytime-watch-audit
          path: |
            real-watch-report/protocol.sha256
            real-watch-report/audit/outcomes.jsonl
            real-watch-report/audit/report.json
          if-no-files-found: warn
          retention-days: 14
  real_change_point_audit:
    name: Disjoint real-model change-point audit · deliberate retrieval intervention
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 7
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned real-model CPU runtime
        run: |
          python -m pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check transformers==4.48.3 safetensors==0.5.3
      - name: Fetch pinned human-annotated dataset and hash frozen protocol
        run: |
          mkdir -p benchmark-data change-point-report
          curl --fail --location --show-error --silent --retry 3 --max-time 120 https://rajpurkar.github.io/SQuAD-explorer/dataset/dev-v1.1.json --output benchmark-data/dev-v1.1.json
          echo "95aa6a52d5d6a735563366753ca50492a658031da74f301ac5238b03966972c9  benchmark-data/dev-v1.1.json" | sha256sum --check
          sha256sum CHANGE_POINT_PROTOCOL.md > change-point-report/protocol.sha256
      - name: Collect real baseline and retrieval-intervention calls
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          python change_point_audit.py \
            --dataset benchmark-data/dev-v1.1.json \
            --out-dir change-point-report/audit \
            --qa-model distilbert/distilbert-base-cased-distilled-squad \
            --acknowledge-model-calls
      - name: Independently recompute both observed outcome traces
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from change_point_watch import restart_risk_stream
          root = Path('change-point-report/audit')
          report = json.loads((root / 'change_point_report.json').read_text())
          rows = [json.loads(line) for line in (root / 'baseline/outcomes.jsonl').read_text().splitlines()]
          changed = [json.loads(line) for line in (root / 'intervention_outcomes.jsonl').read_text().splitlines()]
          assert report['kind'] == 'aru_disjoint_real_model_restart_research_audit'
          assert report['dataset_sha256'] == '95aa6a52d5d6a735563366753ca50492a658031da74f301ac5238b03966972c9'
          assert report['offset'] == 320 and report['requested'] == len(rows) == len(changed) == 120
          assert report['baseline_model_calls'] == 120 and report['intervention_additional_model_calls'] == 65
          assert report['starts'] == [1, 21, 41, 61, 81, 101] and report['horizon'] == 120
          assert report['intervention_onset_after_observations'] == 55
          assert report['intervention_context_cap_characters'] == 128
          assert rows[:55] == changed[:55]
          assert all(a['event_id'] == b['event_id'] and a['group'] == b['group'] for a, b in zip(rows, changed))
          assert report['baseline_errors'] == sum(row['error'] for row in rows)
          assert report['intervention_errors'] == sum(row['error'] for row in changed)
          assert report['model_revision'] and report['rubric_id']
          assert report['intervention_is_natural_live_drift'] is False
          assert report['label_flip_scenarios_are_synthetic'] is True
          assert report['automatic_rollout_permitted'] is False
          for stream, key in ((rows, 'baseline_restart_watch'), (changed, 'observed_intervention_restart_watch')):
              result = restart_risk_stream(
                  stream, groups=report['groups'], model_revision=report['model_revision'],
                  rubric_id=report['rubric_id'], target_error=report['target_error'],
                  alpha=report['familywise_alpha'], horizon=report['horizon'], starts=report['starts'],
              )
              assert result == report[key]
          print('Real baseline errors:', report['baseline_errors'], 'alarm:', report['baseline_restart_watch']['first_alarm_global_observation'])
          print('Real intervention errors:', report['intervention_errors'], 'alarm:', report['observed_intervention_restart_watch']['first_alarm_global_observation'])
          print('Real intervention old-watch alarm:', report['observed_intervention_from_start_alarm'])
          print('Synthetic stress scenarios:', report['injected_label_flip_scenarios'])
          print('Synthetic IID null alarms:', report['synthetic_iid_conditional_null'])
          print('This is a deliberate retrieval intervention, NOT observed spontaneous live drift.')
          PY
      - name: Retain frozen research evidence without question or answer text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aru-change-point-disjoint-real-model-audit
          path: |
            change-point-report/protocol.sha256
            change-point-report/audit/baseline/outcomes.jsonl
            change-point-report/audit/baseline/report.json
            change-point-report/audit/intervention_outcomes.jsonl
            change-point-report/audit/change_point_report.json
          if-no-files-found: warn
          retention-days: 14
  real_calibrated_change_audit:
    name: Separate calibration and real-model retrieval intervention
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 7
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned pretrained CPU runtime
        run: |
          python -m pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check transformers==4.48.3 safetensors==0.5.3
      - name: Fetch pinned human-gold dataset and frozen protocol digest
        run: |
          mkdir -p benchmark-data calibrated-report
          curl --fail --location --show-error --silent --retry 3 --max-time 120 https://rajpurkar.github.io/SQuAD-explorer/dataset/dev-v1.1.json --output benchmark-data/dev-v1.1.json
          echo "95aa6a52d5d6a735563366753ca50492a658031da74f301ac5238b03966972c9  benchmark-data/dev-v1.1.json" | sha256sum --check
          sha256sum CALIBRATED_CHANGE_PROTOCOL.md > calibrated-report/protocol.sha256
      - name: Run separate real calibration, baseline and intervention
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          python calibrated_change_audit.py \
            --dataset benchmark-data/dev-v1.1.json \
            --out-dir calibrated-report/audit \
            --qa-model distilbert/distilbert-base-cased-distilled-squad \
            --qa-revision 564e9b582944a57a3e586bbb98fd6f0a4118db7f \
            --acknowledge-model-calls
      - name: Recompute both calibrated watch reports from exact archived labels
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from calibrated_change_watch import calibrated_restart_risk_stream
          root = Path('calibrated-report/audit')
          report = json.loads((root / 'calibrated_report.json').read_text())
          def read(path):
              return [json.loads(line) for line in (root / path).read_text().splitlines()]
          cal = read('calibration/outcomes.jsonl')
          baseline = read('evaluation/baseline/outcomes.jsonl')
          changed = read('evaluation/intervention_outcomes.jsonl')
          assert report['kind'] == 'aru_independently_calibrated_restart_real_model_research_audit'
          assert report['dataset_sha256'] == '95aa6a52d5d6a735563366753ca50492a658031da74f301ac5238b03966972c9'
          assert report['model_revision'] == '564e9b582944a57a3e586bbb98fd6f0a4118db7f'
          assert report['calibration_offset'] == 440 and report['evaluation_offset'] == 560
          assert report['calibration_model_calls'] == len(cal) == 120
          assert report['baseline_model_calls'] == len(baseline) == 120
          assert report['intervention_additional_model_calls'] == 65 and len(changed) == 120
          assert changed[:55] == baseline[:55]
          assert all(a['event_id'] == b['event_id'] and a['group'] == b['group'] for a,b in zip(baseline,changed))
          assert report['calibration_errors'] == sum(x['error'] for x in cal)
          assert report['baseline_errors'] == sum(x['error'] for x in baseline)
          assert report['intervention_errors'] == sum(x['error'] for x in changed)
          assert report['intervention_onset_after_observations'] == 55
          assert report['intervention_context_cap_characters'] == 128
          assert report['intervention_is_natural_live_drift'] is False
          assert report['automatic_rollout_permitted'] is False
          for stream, key in ((baseline,'baseline_calibrated_watch'), (changed,'intervention_calibrated_watch')):
              expected = calibrated_restart_risk_stream(
                  cal, stream, groups=('short_source','long_source'),
                  model_revision=report['model_revision'], rubric_id=report['rubric_id'],
                  alpha_total=0.05, calibration_delta=0.025,
                  min_slice_calibration=20, horizon=120,
                  starts=(1,21,41,61,81,101),
              )
              assert expected == report[key]
          assert len(report['synthetic_label_flip_scenarios']) == 6
          print('Calibration errors:', report['calibration_errors'])
          print('Calibrated upper targets:', report['baseline_calibrated_watch']['calibration_targets'])
          print('Real baseline errors and first alarm:', report['baseline_errors'], report['baseline_calibrated_watch']['first_alarm_global_observation'])
          print('Real intervention errors and first alarm:', report['intervention_errors'], report['intervention_calibrated_watch']['first_alarm_global_observation'])
          print('Old 50% watch on same questions:', report['same_questions_previous_50_percent_watch'])
          print('Synthetic stress:', report['synthetic_label_flip_scenarios'])
          print('Research only; deliberate retrieval failure; no customer safety claim.')
          PY
      - name: Preserve protocol, aggregate findings and three binary traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aru-calibrated-disjoint-real-model-audit
          path: |
            calibrated-report/protocol.sha256
            calibrated-report/audit/calibration/outcomes.jsonl
            calibrated-report/audit/calibration/report.json
            calibrated-report/audit/evaluation/baseline/outcomes.jsonl
            calibrated-report/audit/evaluation/baseline/report.json
            calibrated-report/audit/evaluation/intervention_outcomes.jsonl
            calibrated-report/audit/evaluation/change_point_report.json
            calibrated-report/audit/calibrated_report.json
          if-no-files-found: warn
          retention-days: 14
  prospective_ledger_audit:
    name: Frozen issuance before real-model calls · complete outcome audit
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 7
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned pretrained CPU model runtime
        run: |
          python -m pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check transformers==4.48.3 safetensors==0.5.3
      - name: Fetch fixed dataset and record frozen protocol hash
        run: |
          mkdir -p benchmark-data prospective-ledger-report
          curl --fail --location --show-error --silent --retry 3 --max-time 120 https://rajpurkar.github.io/SQuAD-explorer/dataset/dev-v1.1.json --output benchmark-data/dev-v1.1.json
          echo "95aa6a52d5d6a735563366753ca50492a658031da74f301ac5238b03966972c9  benchmark-data/dev-v1.1.json" | sha256sum --check
          sha256sum PROSPECTIVE_LEDGER_PROTOCOL.md > prospective-ledger-report/protocol.sha256
          sha256sum RECEIPT_CHALLENGE_PROTOCOL.md > prospective-ledger-report/receipt-protocol.sha256
      - name: Provision ephemeral separate keys for the CI-only experiment
        run: |
          python - <<'PY'
          import os, secrets
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as environment:
              for name in ('ARU_ISSUED_SIGNING_KEY', 'ARU_WATCH_SIGNING_KEY',
                           'ARU_RECEIPT_SIGNING_KEY'):
                  value = secrets.token_urlsafe(48)
                  print('::add-mask::' + value, flush=True)
                  environment.write(name + '=' + value + '\n')
          PY
      - name: Freeze issued question cohort before model initialization
        id: prepare
        run: |
          python prospective_ledger_audit.py prepare \
            --dataset benchmark-data/dev-v1.1.json \
            --prepared-dir prospective-ledger-report/prepared \
            > prospective-ledger-report/prepare_summary.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          result = json.load(open('prospective-ledger-report/prepare_summary.json'))
          assert result['prepared'] and result['issued'] == 120
          print('checkpoint_hmac=' + result['checkpoint_hmac'])
          PY
      - name: Execute pinned real calls and account for every issued outcome
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          set +e
          python prospective_ledger_audit.py run \
            --dataset benchmark-data/dev-v1.1.json \
            --prepared-dir prospective-ledger-report/prepared \
            --out-dir prospective-ledger-report/run \
            --expected-checkpoint-hmac '${{ steps.prepare.outputs.checkpoint_hmac }}' \
            --acknowledge-model-calls > prospective-ledger-report/summary_stdout.json
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 10 ]; then exit "$status"; fi
      - name: Independently recompute ordered model and signed ledger evidence
        run: |
          python prospective_ledger_audit.py verify \
            --dataset benchmark-data/dev-v1.1.json \
            --prepared-dir prospective-ledger-report/prepared \
            --out-dir prospective-ledger-report/run \
            --expected-checkpoint-hmac '${{ steps.prepare.outputs.checkpoint_hmac }}'
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('prospective-ledger-report')
          report = json.loads((root / 'run/accounting_report.json').read_text())
          issued = (root / 'prepared/issued.jsonl').read_text().splitlines()
          receipts = (root / 'prepared/receipts.jsonl').read_text().splitlines()
          grades = (root / 'run/grades.jsonl').read_text().splitlines()
          observed = (root / 'run/actual_model/outcomes.jsonl').read_text().splitlines()
          assert len(issued) == len(receipts) == len(grades) == len(observed) == report['requested'] == report['graded'] == report['receipt_count'] == 120
          assert report['model_revision'] == '564e9b582944a57a3e586bbb98fd6f0a4118db7f'
          assert report['independent_ingress_operator'] is False
          assert report['independently_audited_grader'] is False
          assert report['independent_customer_receipt_delivery'] is False
          assert report['automatic_rollout_permitted'] is False
          print('Observed errors:', report['errors'], 'alarm:', report['degradation_alarm'])
          print('CI-only prospective accounting; no customer or independent-grading claim.')
          PY
      - name: Retain public-benchmark accounting without raw question or answer text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aru-prospective-complete-outcome-accounting
          path: |
            prospective-ledger-report/protocol.sha256
            prospective-ledger-report/receipt-protocol.sha256
            prospective-ledger-report/prepare_summary.json
            prospective-ledger-report/prepared/issued.jsonl
            prospective-ledger-report/prepared/receipts.jsonl
            prospective-ledger-report/prepared/checkpoint.json
            prospective-ledger-report/prepared/plan.json
            prospective-ledger-report/run/actual_model/outcomes.jsonl
            prospective-ledger-report/run/actual_model/report.json
            prospective-ledger-report/run/grades.jsonl
            prospective-ledger-report/run/signed_watch.json
            prospective-ledger-report/run/accounting_report.json
          if-no-files-found: warn
          retention-days: 14
